# Protocol: nanobody-anything
#
# ==============================================================================
# SET A: SO4 / LIGAND-BLOCKING POCKET  (mouse MARCO SRCR)
# ==============================================================================
#
# --- Scientific rationale ---
# The SO4²⁻ binding pocket in 2OYA defines the canonical ligand-binding crevice
# of the MARCO SRCR domain. Nanobodies targeting this site can block receptor
# interactions with ligands (LDL, oxLDL, bacteria, etc.).
#
# NOTE: These positions are DIFFERENT from the original hotspot set (mouse_marco_
# nanobody_hotspot.yaml). The original hotspots use 2OYA label_seq 6,8,15,44,50,
# 52,72,83. This Set A uses 2OYA label_seq 12,14,21,50,56,58,78,89, which is a
# related but distinct set of surface residues in the same functional region.
#
# --- Numbering note ---
# boltzgen uses mmCIF label_seq_id. The mouse_marco_srcr.cif file uses 2OYA
# label_seq 1-102 (sequential), where label_seq N = Q9UEW3 position N+416.
# So binding: 12 means 2OYA label_seq 12 = Q9UEW3 428.
#
# Confirmed mapping (2OYA label_seq = Q9UEW3 position - 416):
#   2OYA label_seq 12 = Q9UEW3 428,  label_seq 14 = Q9UEW3 430,
#   label_seq 21 = Q9UEW3 437,      label_seq 50 = Q9UEW3 466,
#   label_seq 56 = Q9UEW3 472,      label_seq 58 = Q9UEW3 474,
#   label_seq 78 = Q9UEW3 494,      label_seq 89 = Q9UEW3 505
#
# --- Verified residues (from 2OYA structure, 2OYA label_seq numbering) ---
#   2OYA label_seq 12 (Q9UEW3 428) = GLY
#   2OYA label_seq 14 (Q9UEW3 430) = ASN
#   2OYA label_seq 21 (Q9UEW3 437) = TYR
#   2OYA label_seq 50 (Q9UEW3 466) = ARG
#   2OYA label_seq 56 (Q9UEW3 472) = SER
#   2OYA label_seq 58 (Q9UEW3 474) = GLY
#   2OYA label_seq 78 (Q9UEW3 494) = LEU
#   2OYA label_seq 89 (Q9UEW3 505) = HIS
#
# --- Diffusion parameters ---
# Recommended: NUM_STEPS=200, GUIDANCE_SCALE=0.1-0.3, TEMPERATURE=0.9-1.1
#
# --- Scaffold chain notes ---
# Each scaffold YAML already specifies its VHH chain via `include: - chain: id: B|A`.
# All scaffolds contain only a single VHH heavy chain (no light chain).
#
# --- Cys in CDRs ---
# By default nanobody-anything avoids Cys. To permit Cys in designed CDRs:
#   export EXTRA_ARGS='--inverse_fold_avoid ""' ./runs/run_nanobody_campaign.sh ...

entities:
  - file:
      path: ../targets/mouse_marco_srcr.cif
      include:
        - chain:
            id: A
      binding_types:
        - chain:
            id: A
            # 2OYA label_seq positions (verified from structure):
            # 12(GLY), 14(ASN), 21(TYR), 50(ARG),
            # 56(SER), 58(GLY), 78(LEU), 89(HIS)
            binding: 12,14,21,50,56,58,78,89

  - file:
      path:
        # MARCO SRCR has a deep, narrow ligand-binding crevice.
        # Best scaffolds for deep-pocket penetration:
        #   7EOW (21aa CDR3) — vWF A1 binding, maximum reach. RECOMMENDED.
        #   8COH (19aa CDR3) — high shape complementarity vs C4.
        - ../../example/nanobody_scaffolds/7eow.yaml
        - ../../example/nanobody_scaffolds/8coh.yaml