# Protocol: nanobody-anything
# NOTE: residue IDs must use mmCIF label_seq_id numbering.
#
# --- Diffusion parameters ---
# Recommended: NUM_STEPS=200, GUIDANCE_SCALE=0.1–0.3, TEMPERATURE=0.9–1.1
#   export EXTRA_ARGS='--diffusion.num_steps 200 --diffusion.guidance_scale 0.2'
#
# --- Scaffold chain notes ---
# Each scaffold YAML already specifies its VHH chain via `include: - chain: id: B|A`.
# All four scaffolds contain only a single VHH heavy chain (no light chain).
#
# --- Cys in CDRs ---
# By default nanobody-anything avoids Cys. To permit Cys in designed CDRs:
#   export EXTRA_ARGS='--inverse_fold_avoid ""' ./runs/run_nanobody_campaign.sh ...
#
# --- Hotspot residues (mouse MARCO SRCR, 2OYA crystal structure) ---
# Source: PDB 2OYA — cysteine-rich domain of mouse MARCO (dimeric SRCR, 102 aa).
# Hotspots identified from SO4 (sulfate) binding sites AC1/AC2/AC3 in the crystal:
#   AC3 site: label_seq 15, 44, 52 (ARG — core basic patch)
#   AC1 site: label_seq 72 (ARG)
#   Surface/conserved: label_seq 6, 8 (ARG), 50 (ARG), 83 (LYS)
# Combined union: 6,8,15,44,50,52,72,83
# These are verified ligand-binding residues, NOT just surface-exposure heuristics.

entities:
  - file:
      path: ../targets/mouse_marco_srcr.cif
      include:
        - chain:
            id: A
      binding_types:
        - chain:
            id: A
            binding: 6,8,15,44,50,52,72,83

  - file:
      path:
        - ../../example/nanobody_scaffolds/7eow.yaml
        - ../../example/nanobody_scaffolds/7xl0.yaml
        - ../../example/nanobody_scaffolds/8coh.yaml
        - ../../example/nanobody_scaffolds/8z8v.yaml
