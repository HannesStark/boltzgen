# Protocol: nanobody-anything
# MARCO runtime defaults (CLI, not parsed from YAML):
#   --protocol nanobody-anything
#   --diffusion_batch_size 2        # use 1-2 to preserve length diversity
#   --metrics_override plip_hbonds_refolded=0.2 delta_sasa_refolded=0.5
#   --refolding_rmsd_threshold 3.0
# Rationale: MARCO SRCR is polar/beta-rich, so prioritize buried H-bonds/SASA
# and allow VHH loop flexibility during refolding.
#
# NOTE: residue IDs must use mmCIF label_seq_id numbering.
#
# --- Diffusion parameters ---
# Recommended: NUM_STEPS=200, GUIDANCE_SCALE=0.1-0.3, TEMPERATURE=0.9-1.1
#
# --- Scaffold chain notes ---
# Each scaffold YAML already specifies its VHH chain via `include: - chain: id: B|A`.
# All four scaffolds contain only a single VHH heavy chain (no light chain).
#
# --- Cys in CDRs ---
# By default nanobody-anything avoids Cys. To permit Cys in designed CDRs:
#   export EXTRA_ARGS='--inverse_fold_avoid ""' ./runs/run_nanobody_campaign.sh ...
#
# --- Hotspot residues (mouse MARCO SRCR, label_seq 1-102) ---
# Source: PDB 2OYA — cysteine-rich domain of mouse MARCO (dimeric SRCR, 102 aa).
# Hotspots identified from SO4 (sulfate) binding sites AC1/AC2/AC3 in the crystal.
#
# The mmCIF file uses label_seq 1-102 (sequential) for the 2OYA chain.
# boltzgen uses mmCIF label_seq_id — no offset needed.
#
# Verified residues (from original 2OYA structure, label_seq 1-102):
#   label_seq  6 = Q9UEW3 422 = ARG   — conserved basic patch, AC3-adjacent
#   label_seq  8 = Q9UEW3 424 = ARG   — conserved basic patch
#   label_seq 15 = Q9UEW3 431 = ARG   — AC3 sulfate site
#   label_seq 44 = Q9UEW3 460 = ARG   — AC3-adjacent
#   label_seq 50 = Q9UEW3 466 = ARG   — AC2 sulfate site
#   label_seq 52 = Q9UEW3 468 = ARG   — AC2-adjacent
#   label_seq 72 = Q9UEW3 488 = ARG   — AC1 sulfate site
#   label_seq 83 = Q9UEW3 499 = LYS   — surface-exposed, conserved
#
# Verify with: boltzgen check specs/mouse_marco_nanobody_hotspot.yaml

entities:
  - file:
      path: ../targets/mouse_marco_srcr.cif
      include:
        - chain:
            id: A
      binding_types:
        - chain:
            id: A
            # label_seq positions (verified from 2OYA DSSP analysis):
            # 6(ARG), 8(ARG), 15(ARG), 44(ARG), 50(ARG), 52(ARG), 72(ARG), 83(LYS)
            binding: 6,8,15,44,50,52,72,83

  - file:
      path:
        # MARCO SRCR has a deep, narrow ligand-binding crevice.
        # Best scaffolds for deep-pocket penetration:
        #   7EOW (21aa CDR3) — vWF A1 binding, maximum reach. RECOMMENDED.
        #   8COH (19aa CDR3) — high shape complementarity vs C4.
        # Dropped: 7XL0 (14aa, moderate) and 8Z8V (11aa, too shallow for MARCO crevice).
        - ../../example/nanobody_scaffolds/7eow.yaml
        - ../../example/nanobody_scaffolds/8coh.yaml