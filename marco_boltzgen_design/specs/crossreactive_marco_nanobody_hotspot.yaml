# Protocol: nanobody-anything
# Strategy: bias nanobody designs toward conserved/exposed MARCO residues across species.
entities:
  - file:
      path: ../targets/human_MARCO_input.cif
      include:
        - chain:
            id: A
      binding_types:
        - chain:
            id: A
            binding: 340,344,350,352,356,390..394 # TODO conserved human residues

  - file:
      path: ../targets/mouse_Marco_input.cif
      include:
        - chain:
            id: A
      binding_types:
        - chain:
            id: A
            binding: 337,341,347,349,353,388..392 # TODO mapped conserved mouse residues

  - file:
      path:
        - ../../example/nanobody_scaffolds/7eow.yaml
        - ../../example/nanobody_scaffolds/7xl0.yaml
        - ../../example/nanobody_scaffolds/8coh.yaml
        - ../../example/nanobody_scaffolds/8z8v.yaml
