# Protocol: nanobody-anything
# MARCO runtime defaults (CLI, not parsed from YAML):
#   --protocol nanobody-anything
#   --diffusion_batch_size 2        # use 1-2 to preserve length diversity
#   --metrics_override plip_hbonds_refolded=0.2 delta_sasa_refolded=0.5
#   --refolding_rmsd_threshold 3.0
# Rationale: MARCO SRCR is polar/beta-rich, so prioritize buried H-bonds/SASA
# and allow VHH loop flexibility during refolding.
#
# Legacy filename note: this spec now uses VHH scaffold files and should be
# run with nanobody-anything, even if the filename says binder/peptide.
#
# --- Hotspot residues (human MARCO SRCR, Q9UEW3 positions 418-520) ---
# Source: Q9UEW3 alignment vs mouse 2OYA SRCR (68.6% identity = 70/102).
# Mapping confirmed by user: human SRCR = positions 418-520.
# Mouse 2OYA label_seq N -> human Q9UEW3 = N + 417 (offset confirmed).
#
# Hotspots: 423=R (← mouse 6), 425=R (← mouse 8), 432=R (← mouse 15),
#   461=E (← mouse 44), 467=K (← mouse 50), 469=R (← mouse 52),
#   489=R (← mouse 72), 500=K (← mouse 83)
# These form the ARG-rich conserved basic patch — the functional ligand-binding surface.

entities:
  - file:
      path: ../targets/human_MARCO_input.cif
      include:
        - chain:
            id: A
      binding_types:
        - chain:
            id: A
            binding: 423,425,432,461,467,469,489,500

  - file:
      path:
        # VHH scaffolds for MARCO nanobody design.
        # 7EOW (21aa CDR3) maximizes reach; 8COH (19aa CDR3) adds shape diversity.
        - ../../example/nanobody_scaffolds/7eow.yaml
        - ../../example/nanobody_scaffolds/8coh.yaml
