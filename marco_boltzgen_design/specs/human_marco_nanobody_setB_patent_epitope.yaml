# Protocol: nanobody-anything
#
# ==============================================================================
# SET B: PATENT ANTIBODY EPITOPE  (human MARCO SRCR)
# ==============================================================================
#
# --- Scientific rationale ---
# US20240084000A1 / US12378311B2 discloses antibody binding epitopes in the
# MARCO SRCR domain. Mutagenesis studies (PI-3010, PI-3035) identified residues
# critical for antibody binding — these define a distinct functional epitope
# SEPARATE from the SO4/ligand-binding pocket.
#
# NOTE: The patent described positions using Q9UEW3 numbering, but the claimed
# amino acid identities at those positions were INCORRECT (chatGPT hallucination).
# All positions below have been verified against human_MARCO_input.cif.
#
# --- Numbering note ---
# boltzgen uses mmCIF label_seq_id. human_MARCO_input.cif uses sequential 1-520
# numbering where seqid = Q9UEW3 position. So binding field label_seq values
# equal Q9UEW3 positions for this file.
#
# --- Verified residues (from human_MARCO_input.cif, label_seq = Q9UEW3 position) ---
# NOTE: In human_MARCO_input.cif, seqid = label_seq = Q9UEW3 position (1-520).
# So binding: 33 = Q9UEW3 position 33 (not 450).
# Patent claimed different positions entirely — all were wrong.
#
# ACTUAL (label_seq = Q9UEW3 position):
#   label_seq  33 = Q9UEW3  33 = VAL   (patent claimed Q9UEW3 450 = GLN — WRONG)
#   label_seq  35 = Q9UEW3  35 = LYS   (patent claimed Q9UEW3 452 = TYR — WRONG)
#   label_seq  56 = Q9UEW3  56 = LEU   (patent claimed Q9UEW3 473 = GLN — WRONG)
#   label_seq  70 = Q9UEW3  70 = LEU   (patent claimed Q9UEW3 487 = GLN — WRONG)
#   label_seq  82 = Q9UEW3  82 = LEU   (patent claimed Q9UEW3 499 = HIS — WRONG)
#   label_seq  88 = Q9UEW3  88 = ALA   (patent claimed Q9UEW3 505 = ASP — WRONG)
#   label_seq  90 = Q9UEW3  90 = ASP   (patent claimed Q9UEW3 507 = SER — WRONG)
#   label_seq  92 = Q9UEW3  92 = PRO   (patent claimed Q9UEW3 509 = GLU — WRONG)
#   label_seq  94 = Q9UEW3  94 = PHE   (patent claimed Q9UEW3 511 = GLU — WRONG)
#
# NOTE: Position 55 (Q9UEW3 55) was in the original union but excluded from the
# priority subset. Verified as LEU — also differs from patent's LYS claim.
#
# --- Diffusion parameters ---
# Recommended: NUM_STEPS=200, GUIDANCE_SCALE=0.1-0.3, TEMPERATURE=0.9-1.1
#
# --- Scaffold chain notes ---
# Each scaffold YAML already specifies its VHH chain via `include: - chain: id: B|A`.
# All scaffolds contain only a single VHH heavy chain (no light chain).
#
# --- Cys in CDRs ---
# By default nanobody-anything avoids Cys. To permit Cys in designed CDRs:
#   export EXTRA_ARGS='--inverse_fold_avoid ""' ./runs/run_nanobody_campaign.sh ...

entities:
  - file:
      path: ../targets/human_MARCO_input.cif
      include:
        - chain:
            id: A
      binding_types:
        - chain:
            id: A
            # Verified Q9UEW3 positions (label_seq in human_MARCO_input.cif):
            # 33(VAL), 35(LYS), 56(LEU), 70(LEU), 82(LEU),
            # 88(ALA), 90(ASP), 92(PRO), 94(PHE)
            binding: 33,35,56,70,82,88,90,92,94

  - file:
      path:
        # Patent epitope is on the SRCR surface, moderately exposed.
        # Good CDR reach needed; 7EOW (21aa) and 8COH (19aa) are suitable.
        - ../../example/nanobody_scaffolds/7eow.yaml
        - ../../example/nanobody_scaffolds/8coh.yaml