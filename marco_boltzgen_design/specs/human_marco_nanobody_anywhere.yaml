# Protocol: nanobody-anything
# MARCO runtime defaults (CLI, not parsed from YAML):
#   --protocol nanobody-anything
#   --diffusion_batch_size 2        # use 1-2 to preserve length diversity
#   --metrics_override plip_hbonds_refolded=0.2 delta_sasa_refolded=0.5
#   --refolding_rmsd_threshold 3.0
# Rationale: MARCO SRCR is polar/beta-rich, so prioritize buried H-bonds/SASA
# and allow VHH loop flexibility during refolding.
#
# Designs VHH CDRs on provided nanobody scaffolds against human MARCO.
#
# --- Diffusion parameters ---
# Recommended: NUM_STEPS=200, GUIDANCE_SCALE=0.1–0.3, TEMPERATURE=0.9–1.1
#
# --- Scaffold chain notes ---
# Each scaffold YAML already specifies its VHH chain via `include: - chain: id: B|A`.
# All four scaffolds contain only a single VHH heavy chain (no light chain).
#
# --- Cys in CDRs ---
# By default nanobody-anything avoids Cys. To permit Cys in designed CDRs:
#   export EXTRA_ARGS='--inverse_fold_avoid ""' ./runs/run_nanobody_campaign.sh ...
#
# --- Optional: restrict to SRCR domain ---
# Uncomment res_index to focus design on the SRCR domain (residue range 418..520).

entities:
  - file:
      path: ../targets/human_MARCO_input.cif
      include:
        - chain:
            id: A # TODO replace target chain
            # res_index: 418..520  # optional SRCR-focused residue range

  - file:
      path:
        # MARCO SRCR has a deep, narrow ligand-binding crevice.
        # Best scaffolds for deep-pocket penetration:
        #   7EOW (21aa CDR3) — vWF A1 binding, maximum reach. RECOMMENDED.
        #   8COH (19aa CDR3) — high shape complementarity vs C4.
        # Dropped: 7XL0 (14aa, moderate) and 8Z8V (11aa, too shallow for MARCO crevice).
        - ../../example/nanobody_scaffolds/7eow.yaml
        - ../../example/nanobody_scaffolds/8coh.yaml
