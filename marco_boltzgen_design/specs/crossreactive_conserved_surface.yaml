# Protocol: nanobody-anything
# MARCO runtime defaults (CLI, not parsed from YAML):
#   --protocol nanobody-anything
#   --diffusion_batch_size 2        # use 1-2 to preserve length diversity
#   --metrics_override plip_hbonds_refolded=0.2 delta_sasa_refolded=0.5
#   --refolding_rmsd_threshold 3.0
# Rationale: MARCO SRCR is polar/beta-rich, so prioritize buried H-bonds/SASA
# and allow VHH loop flexibility during refolding.
#
# Legacy filename note: this spec now uses VHH scaffold files and should be
# run with nanobody-anything, even if the filename says binder/peptide.
#
# Strategy: enforce binding to conserved, exposed residues for likely cross-reactivity.
#
# --- Diffusion parameters (tune via EXTRA_ARGS in run_production.sh) ---
# Recommended: NUM_STEPS=200, GUIDANCE_SCALE=0.1–0.3, TEMPERATURE=0.9–1.1
#
# --- Hotspot residues ---
# Cross-reactive design targets conserved SRCR surface in BOTH human and mouse.
#
# Mouse MARCO SRCR (2OYA, 102 aa): label_seq 6,8,15,44,50,52,72,83
#   Source: PDB 2OYA — verified from SO4 binding sites AC1/AC3.
#
# Human MARCO SRCR (Q9UEW3 positions 418-520): label_seq 423,425,432,461,467,469,489,500
#   Mapping confirmed: human SRCR = positions 418-520.
#   Mouse 2OYA label_seq N -> human Q9UEW3 = N + 417.
#   These form the same conserved ARG-rich basic patch as mouse.
#
# NOTE: In human_MARCO_input.cif, residues are numbered sequentially 1-520,
# so label_seq_id equals Q9UEW3 full-sequence positions listed above.

entities:
  - file:
      path: ../targets/human_MARCO_input.cif
      include:
        - chain:
            id: A # TODO: replace with actual chain ID from your human structure
      binding_types:
        - chain:
            id: A # TODO: replace with actual chain ID from your human structure
            binding: 423,425,432,461,467,469,489,500

  - file:
      path: ../targets/mouse_marco_srcr.cif
      include:
        - chain:
            id: A
      binding_types:
        - chain:
            id: A
            binding: 6,8,15,44,50,52,72,83

  - file:
      path:
        # VHH scaffolds for MARCO nanobody design.
        # 7EOW (21aa CDR3) maximizes reach; 8COH (19aa CDR3) adds shape diversity.
        - ../../example/nanobody_scaffolds/7eow.yaml
        - ../../example/nanobody_scaffolds/8coh.yaml
