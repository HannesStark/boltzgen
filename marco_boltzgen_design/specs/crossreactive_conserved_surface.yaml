# Protocol: protein-anything
# Strategy: enforce binding to conserved, exposed residues for likely cross-reactivity.
#
# --- Diffusion parameters (tune via EXTRA_ARGS in run_production.sh) ---
# Recommended: NUM_STEPS=200, GUIDANCE_SCALE=0.1–0.3, TEMPERATURE=0.9–1.1
#   export EXTRA_ARGS='--diffusion.num_steps 200 --diffusion.guidance_scale 0.2'
#
# --- Hotspot residues ---
# Cross-reactive design targets conserved SRCR surface in BOTH human and mouse.
#
# Mouse MARCO SRCR (2OYA, 102 aa): label_seq 6,8,15,44,50,52,72,83
#   Source: PDB 2OYA — verified from SO4 binding sites AC1/AC3.
#
# Human MARCO SRCR: full-sequence positions 425,432,461,467,469,489,500
#   Source: Q9UEW3 alignment vs 2OYA, identity 70/102 = 68.6%.
#   If your human structure uses mmCIF label_seq, subtract 415.
#
# Run find_marco_srcr_hotspots_v2.py with --human-structure to validate
# the exact label_seq values for YOUR specific human MARCO structure.

entities:
  - protein:
      id: B
      sequence: 50..90

  - file:
      path: ../targets/human_MARCO_input.cif
      include:
        - chain:
            id: A # TODO: replace with actual chain ID from your human structure
      binding_types:
        - chain:
            id: A # TODO: replace with actual chain ID from your human structure
            binding: 425,432,461,467,469,489,500

  - file:
      path: ../targets/mouse_marco_srcr.cif
      include:
        - chain:
            id: A
      binding_types:
        - chain:
            id: A
            binding: 6,8,15,44,50,52,72,83
