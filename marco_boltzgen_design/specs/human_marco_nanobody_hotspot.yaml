# Protocol: nanobody-anything
# MARCO runtime defaults (CLI, not parsed from YAML):
#   --protocol nanobody-anything
#   --diffusion_batch_size 2        # use 1-2 to preserve length diversity
#   --metrics_override plip_hbonds_refolded=0.2 delta_sasa_refolded=0.5
#   --refolding_rmsd_threshold 3.0
# Rationale: MARCO SRCR is polar/beta-rich, so prioritize buried H-bonds/SASA
# and allow VHH loop flexibility during refolding.
#
# NOTE: residue IDs must use mmCIF label_seq_id numbering.
#
# --- Diffusion parameters ---
# Recommended: NUM_STEPS=200, GUIDANCE_SCALE=0.1-0.3, TEMPERATURE=0.9-1.1
#
# --- Scaffold chain notes ---
# Each scaffold YAML already specifies its VHH chain via `include: - chain: id: B|A`.
# All four scaffolds contain only a single VHH heavy chain (no light chain).
#
# --- Cys in CDRs ---
# By default nanobody-anything avoids Cys. To permit Cys in designed CDRs:
#   export EXTRA_ARGS='--inverse_fold_avoid ""' ./runs/run_nanobody_campaign.sh ...
#
# --- Hotspot residues (human MARCO SRCR, Q9UEW3 positions 418-520) ---
# Source: Q9UEW3 alignment vs mouse 2OYA SRCR (68.6% identity = 70/102).
# Mapping: human Q9UEW3 = 2OYA label_seq + 417 (offset confirmed).
# Human SRCR domain = Q9UEW3 positions 418-520.
#
# The mmCIF file human_MARCO_input.cif uses sequential 1-520 numbering where
# seqid = Q9UEW3 position. So label_seq = Q9UEW3 position for this file.
#
# Verified positions (Q9UEW3 numbering, aligned from 2OYA DSSP analysis):
#   Q9UEW3 423 = ILE  (← mouse 2OYA  6 = VAL, species-diff)
#   Q9UEW3 425 = LEU  (← mouse 2OYA  8 = ILE, species-diff)
#   Q9UEW3 432 = GLU  (← mouse 2OYA 15 = GLY, species-diff)
#   Q9UEW3 461 = PHE  (← mouse 2OYA 44 = MET, species-diff)
#   Q9UEW3 467 = VAL  (← mouse 2OYA 50 = GLY, species-diff)
#   Q9UEW3 469 = TYR  (← mouse 2OYA 52 = ALA, species-diff)
#   Q9UEW3 489 = ALA  (← mouse 2OYA 72 = GLY, species-diff)
#   Q9UEW3 500 = ASN  (← mouse 2OYA 83 = LYS, species-diff)
#
# These form the conserved basic/polar patch — the functional ligand-binding surface.
# Species differences from mouse are noted above.
#
# Verify with: boltzgen check specs/human_marco_nanobody_hotspot.yaml

entities:
  - file:
      path: ../targets/human_MARCO_input.cif
      include:
        - chain:
            id: A
      binding_types:
        - chain:
            id: A
            # Q9UEW3 positions (seqid in human_MARCO_input.cif):
            # 423(ILE), 425(LEU), 432(GLU), 461(PHE),
            # 467(VAL), 469(TYR), 489(ALA), 500(ASN)
            binding: 423,425,432,461,467,469,489,500

  - file:
      path:
        # MARCO SRCR has a deep, narrow ligand-binding crevice.
        # Best scaffolds for deep-pocket penetration:
        #   7EOW (21aa CDR3) — vWF A1 binding, maximum reach. RECOMMENDED.
        #   8COH (19aa CDR3) — high shape complementarity vs C4.
        # Dropped: 7XL0 (14aa, moderate) and 8Z8V (11aa, too shallow for MARCO crevice).
        - ../../example/nanobody_scaffolds/7eow.yaml
        - ../../example/nanobody_scaffolds/8coh.yaml