# Protocol: nanobody-anything
# NOTE: residue IDs must use mmCIF label_seq_id numbering.
#
# --- Diffusion parameters ---
# Recommended: NUM_STEPS=200, GUIDANCE_SCALE=0.1–0.3, TEMPERATURE=0.9–1.1
#   export EXTRA_ARGS='--diffusion.num_steps 200 --diffusion.guidance_scale 0.2'
#
# --- Scaffold chain notes ---
# Each scaffold YAML already specifies its VHH chain via `include: - chain: id: B|A`.
# All four scaffolds contain only a single VHH heavy chain (no light chain).
#
# --- Cys in CDRs ---
# By default nanobody-anything avoids Cys. To permit Cys in designed CDRs:
#   export EXTRA_ARGS='--inverse_fold_avoid ""' ./runs/run_nanobody_campaign.sh ...
#
# Verified hotspot residues (human MARCO SRCR, Q9UEW3 positions 418-520):
# Source: Q9UEW3 alignment vs mouse 2OYA SRCR (68.6% identity = 70/102).
# Mapping confirmed by user: human SRCR = positions 418-520.
# Mouse 2OYA label_seq N -> human Q9UEW3 = N + 417 (offset confirmed).
#
# Human SRCR residues (Q9UEW3 full-sequence positions):
#   423=R (← mouse 6), 425=R (← mouse 8), 432=R (← mouse 15),
#   461=E (← mouse 44), 467=K (← mouse 50), 469=R (← mouse 52),
#   489=R (← mouse 72), 500=K (← mouse 83)
# These form the ARG-rich conserved basic patch — the functional ligand-binding surface.
#
# NOTE: The values below are Q9UEW3 full-sequence positions (1-520).
# boltzgen uses mmCIF label_seq_id — since human_MARCO_input.cif uses
# sequential 1-520 numbering, these values are label_seq_id = Q9UEW3 position.
# Verify with: boltzgen check specs/human_marco_nanobody_hotspot.yaml

entities:
  - file:
      path: ../targets/human_MARCO_input.cif
      include:
        - chain:
            id: A
      binding_types:
        - chain:
            id: A
            binding: 423,425,432,461,467,469,489,500

  - file:
      path:
        - ../../example/nanobody_scaffolds/7eow.yaml
        - ../../example/nanobody_scaffolds/7xl0.yaml
        - ../../example/nanobody_scaffolds/8coh.yaml
        - ../../example/nanobody_scaffolds/8z8v.yaml
