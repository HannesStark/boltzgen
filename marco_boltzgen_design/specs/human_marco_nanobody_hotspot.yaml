# Protocol: nanobody-anything
# NOTE: residue IDs must use mmCIF label_seq_id numbering.
#
# --- Diffusion parameters ---
# Recommended: NUM_STEPS=200, GUIDANCE_SCALE=0.1–0.3, TEMPERATURE=0.9–1.1
#   export EXTRA_ARGS='--diffusion.num_steps 200 --diffusion.guidance_scale 0.2'
#
# --- Scaffold chain notes ---
# Each scaffold YAML already specifies its VHH chain via `include: - chain: id: B|A`.
# All four scaffolds contain only a single VHH heavy chain (no light chain).
#
# --- Cys in CDRs ---
# By default nanobody-anything avoids Cys. To permit Cys in designed CDRs:
#   export EXTRA_ARGS='--inverse_fold_avoid ""' ./runs/run_nanobody_campaign.sh ...
#
# --- Hotspot residues (human MARCO) ---
# Source: aligned from human MARCO (Q9UEW3, 520 aa full sequence)
# against mouse 2OYA SRCR (PDB 2OYA, label_seq 1-102).
# Human SRCR domain starts at position ~416 in the full sequence.
#
# Verified ARG residues (from alignment, full-sequence positions in Q9UEW3):
#   425=R, 432=R, 461=R, 467=K, 469=R, 489=R, 500=K
# These map to mouse 2OYA label_seq 8, 15, 44, 50, 52, 72, 83 respectively.
# Identity: 70/102 = 68.6%.
#
# IMPORTANT: The values below are in Q9UEW3 full-sequence numbering (416-520).
# If your human MARCO mmCIF uses mmCIF label_seq_id, convert by subtracting 415
# (e.g., 425 full-seq → label_seq 10 within the SRCR domain).
# Validate against YOUR structure using find_marco_srcr_hotspots_v2.py.

entities:
  - file:
      path: ../targets/human_MARCO_input.cif
      include:
        - chain:
            id: A # TODO: replace with actual chain ID from your structure
      binding_types:
        - chain:
            id: A # TODO: replace with actual chain ID from your structure
            binding: 425,432,461,467,469,489,500

  - file:
      path:
        - ../../example/nanobody_scaffolds/7eow.yaml
        - ../../example/nanobody_scaffolds/7xl0.yaml
        - ../../example/nanobody_scaffolds/8coh.yaml
        - ../../example/nanobody_scaffolds/8z8v.yaml
