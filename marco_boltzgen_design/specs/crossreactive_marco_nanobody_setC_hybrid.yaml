# Protocol: nanobody-anything
#
# ==============================================================================
# SET C: HYBRID INTERFACE  (cross-reactive: human + mouse MARCO SRCR)
# ==============================================================================
#
# --- Scientific rationale ---
# Combines the SO4/ligand-binding pocket with the patent antibody epitope to
# maximize nanobody paratope size and interface stability. Targets the broadest
# possible functional surface of the MARCO SRCR domain.
#
# NOTE: The original derivation used patent Q9UEW3 positions that had INCORRECT
# amino acid claims (chatGPT hallucination). All positions have been verified
# against mmCIF structures.
#
# --- Numbering note ---
# boltzgen uses mmCIF label_seq_id.
#   Human: human_MARCO_input.cif uses seqid = label_seq = Q9UEW3 position (1-520).
#          So binding label_seq values equal Q9UEW3 positions for human.
#   Mouse: mouse_marco_srcr.cif uses 2OYA label_seq 1-102 (sequential).
#          So binding label_seq values = 2OYA label_seq for mouse.
#          IMPORTANT: mouse label_seq N ≠ human Q9UEW3 N — these are different
#          coordinate systems (2OYA SRCR vs full MARCO).
#
# --- Verified residues ---
#
# Human (human_MARCO_input.cif, label_seq = Q9UEW3 position):
#   Q9UEW3 35 = LYS    Q9UEW3 50 = VAL    Q9UEW3 56 = LEU
#   Q9UEW3 58 = ALA    Q9UEW3 70 = LEU    Q9UEW3 78 = GLU
#   Q9UEW3 82 = LEU    Q9UEW3 88 = ALA    Q9UEW3 89 = GLU
#   Q9UEW3 90 = ASP    Q9UEW3 92 = PRO    Q9UEW3 94 = PHE
#
# Mouse (mouse_marco_srcr.cif, 2OYA label_seq 1-102):
#   2OYA label_seq 12 = Q9UEW3 428 = GLY
#   2OYA label_seq 14 = Q9UEW3 430 = ASN
#   2OYA label_seq 21 = Q9UEW3 437 = TYR
#   2OYA label_seq 50 = Q9UEW3 466 = ARG
#   2OYA label_seq 56 = Q9UEW3 472 = SER
#   2OYA label_seq 58 = Q9UEW3 474 = GLY
#   2OYA label_seq 78 = Q9UEW3 494 = LEU
#   2OYA label_seq 89 = Q9UEW3 505 = HIS
#
# Cross-species conservation: positions 50, 56, 58, 78, 89 appear in both human
# and mouse (Q9UEW3 466,472,474,494,505). Key conserved contact at Q9UEW3 472
# (LEU in human, SER in mouse).
#
# --- Diffusion parameters ---
# Recommended: NUM_STEPS=200, GUIDANCE_SCALE=0.1-0.3, TEMPERATURE=0.9-1.1
#
# --- Scaffold chain notes ---
# Each scaffold YAML already specifies its VHH chain via `include: - chain: id: B|A`.
# All scaffolds contain only a single VHH heavy chain (no light chain).
#
# --- Cys in CDRs ---
# By default nanobody-anything avoids Cys. To permit Cys in designed CDRs:
#   export EXTRA_ARGS='--inverse_fold_avoid ""' ./runs/run_nanobody_campaign.sh ...

entities:
  - file:
      path: ../targets/human_MARCO_input.cif
      include:
        - chain:
            id: A
      binding_types:
        - chain:
            id: A
            # Human (label_seq = Q9UEW3 position):
            # 35(LYS), 50(VAL), 56(LEU), 58(ALA), 70(LEU), 78(GLU),
            # 82(LEU), 88(ALA), 89(GLU), 90(ASP), 92(PRO), 94(PHE)
            binding: 35,50,56,58,70,78,82,88,89,90,92,94

  - file:
      path: ../targets/mouse_marco_srcr.cif
      include:
        - chain:
            id: A
      binding_types:
        - chain:
            id: A
            # Mouse: 2OYA label_seq values (= 2OYA domain position)
            # 12(GLY), 14(ASN), 21(TYR), 50(ARG),
            # 56(SER), 58(GLY), 78(LEU), 89(HIS)
            binding: 12,14,21,50,56,58,78,89

  - file:
      path:
        # Hybrid interface needs maximum CDR reach for large paratope.
        # 7EOW (21aa CDR3) is RECOMMENDED for this large interface.
        - ../../example/nanobody_scaffolds/7eow.yaml
        - ../../example/nanobody_scaffolds/8coh.yaml