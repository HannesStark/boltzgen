# Protocol: nanobody-anything
#
# ==============================================================================
# SET C: HYBRID INTERFACE  (cross-reactive: human + mouse MARCO SRCR)
# ==============================================================================
#
# --- Scientific rationale ---
# Combines the SO4/ligand-binding pocket with the patent antibody epitope to
# maximize nanobody paratope size and interface stability. Targets the broadest
# possible functional surface of the MARCO SRCR domain.
#
# Human hotspots (Q9UEW3 positions → label_seq):
#   From patent epitope:   Y452→35, K473→56, Q487→70, T499→82,
#                          H505→88, D507→90, S509→92, E511→94
#   From SO4 pocket:       Q467→50, Q475→58, W495→78, H506→89
#   Combined (unique):  35,50,56,58,70,78,82,88,89,90,92,94
#
# Mouse hotspots (2OYA label_seq — no offset needed):
#   From SO4 pocket:       Q429→12, Y431→14, K438→21,
#                          Q467→50, K473→56, Q475→58,
#                          W495→78, H506→89
#   NOTE: Mouse label_seq 50,56,58,78,89 overlap with human label_seq.
#   Cross-species conserved positions highlighted below.
#
# --- Cross-species conservation ---
# Residue 473 (K in human, K in mouse) is the KEY conserved contact —
# appears in BOTH the SO4 pocket and the patent antibody epitope.
# Residues 467, 475, 495, 506 (Q, Q, W, H) are shared between both sets.
# Only Q452 (human) / D452 (mouse) differs — the human/mouse antibody overlap.
#
# --- Numbering note ---
# Human: Q9UEW3 positions → label_seq (offset 417).
# Mouse: 2OYA uses label_seq 1-102 directly.
# Verify with: boltzgen check specs/crossreactive_marco_nanobody_setC_hybrid.yaml
#
# --- Diffusion parameters ---
# Recommended: NUM_STEPS=200, GUIDANCE_SCALE=0.1-0.3, TEMPERATURE=0.9-1.1
#
# --- Scaffold chain notes ---
# Each scaffold YAML already specifies its VHH chain via `include: - chain: id: B|A`.
# All scaffolds contain only a single VHH heavy chain (no light chain).
#
# --- Cys in CDRs ---
# By default nanobody-anything avoids Cys. To permit Cys in designed CDRs:
#   export EXTRA_ARGS='--inverse_fold_avoid ""' ./runs/run_nanobody_campaign.sh ...

# NOTE: BoltzGen does not support `name` as a top-level key. Name is for human reference only.

entities:
  - file:
      path: ../targets/human_MARCO_input.cif
      include:
        - chain:
            id: A
      binding_types:
        - chain:
            id: A
            # Human hybrid interface (Q9UEW3 → label_seq):
            # Patent epitope + SO4 pocket union:
            # 35(Y452), 50(Q467), 56(K473), 58(Q475), 70(Q487),
            # 78(W495), 82(T499), 88(H505), 89(H506),
            # 90(D507), 92(S509), 94(E511)
            binding: 35,50,56,58,70,78,82,88,89,90,92,94

  - file:
      path: ../targets/mouse_marco_srcr.cif
      include:
        - chain:
            id: A
      binding_types:
        - chain:
            id: A
            # Mouse SO4 pocket — label_seq 1-102 in 2OYA:
            # 12(Q429), 14(Y431), 21(K438), 50, 56, 58, 78, 89
            # Cross-species overlap with human: 50,56,58,78,89
            binding: 12,14,21,50,56,58,78,89

  - file:
      path:
        # Hybrid interface needs maximum CDR reach for large paratope.
        # 7EOW (21aa CDR3) is RECOMMENDED for this large interface.
        - ../../example/nanobody_scaffolds/7eow.yaml
        - ../../example/nanobody_scaffolds/8coh.yaml