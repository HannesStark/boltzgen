# Protocol: nanobody-anything
#
# ==============================================================================
# SET C: HYBRID INTERFACE  (cross-reactive: human + mouse MARCO SRCR)
# ==============================================================================
#
# --- Scientific rationale ---
# Combines the SO4/ligand-binding pocket with the patent antibody epitope to
# maximize nanobody paratope size and interface stability. Targets the broadest
# possible functional surface of the MARCO SRCR domain.
#
# NOTE: The original derivation used patent Q9UEW3 positions that had INCORRECT
# amino acid claims (chatGPT hallucination). All positions have been verified
# against mmCIF structures.
#
# --- Numbering note ---
# boltzgen uses mmCIF label_seq_id.
#   Human: human_MARCO_input.cif uses seqid = Q9UEW3 position (1-520).
#          So binding label_seq = Q9UEW3 position for human.
#   Mouse: mouse_marco_srcr.cif uses seqid = Q9UEW3 position (417-515).
#          So binding label_seq = Q9UEW3 position for mouse.
#
# --- Verified residues ---
#
# Human (human_MARCO_input.cif):
#   label_seq  35 = Q9UEW3 452 = LYS
#   label_seq  50 = Q9UEW3 467 = VAL
#   label_seq  56 = Q9UEW3 473 = LEU
#   label_seq  58 = Q9UEW3 475 = ALA
#   label_seq  70 = Q9UEW3 487 = LEU
#   label_seq  78 = Q9UEW3 495 = GLU
#   label_seq  82 = Q9UEW3 499 = LEU
#   label_seq  88 = Q9UEW3 505 = ALA
#   label_seq  89 = Q9UEW3 506 = GLU
#   label_seq  90 = Q9UEW3 507 = ASP
#   label_seq  92 = Q9UEW3 509 = PRO
#   label_seq  94 = Q9UEW3 511 = PHE
#
# Mouse (mouse_marco_srcr.cif):
#   label_seq  12 = Q9UEW3 429 = THR
#   label_seq  14 = Q9UEW3 431 = ARG
#   label_seq  21 = Q9UEW3 438 = TYR
#   label_seq  50 = Q9UEW3 467 = GLY
#   label_seq  56 = Q9UEW3 473 = TYR
#   label_seq  58 = Q9UEW3 475 = GLY
#   label_seq  78 = Q9UEW3 495 = TRP
#   label_seq  89 = Q9UEW3 506 = ASN
#
# Cross-species conservation: label_seq 50, 56, 58, 78, 89 appear in both human
# and mouse (Q9UEW3 467, 473, 475, 495, 506). Key conserved contact at Q9UEW3 473
# (LEU in human, TYR in mouse).
#
# --- Diffusion parameters ---
# Recommended: NUM_STEPS=200, GUIDANCE_SCALE=0.1-0.3, TEMPERATURE=0.9-1.1
#
# --- Scaffold chain notes ---
# Each scaffold YAML already specifies its VHH chain via `include: - chain: id: B|A`.
# All scaffolds contain only a single VHH heavy chain (no light chain).
#
# --- Cys in CDRs ---
# By default nanobody-anything avoids Cys. To permit Cys in designed CDRs:
#   export EXTRA_ARGS='--inverse_fold_avoid ""' ./runs/run_nanobody_campaign.sh ...

entities:
  - file:
      path: ../targets/human_MARCO_input.cif
      include:
        - chain:
            id: A
      binding_types:
        - chain:
            id: A
            # Human hybrid interface: verified Q9UEW3 positions
            # 452(LYS), 467(VAL), 473(LEU), 475(ALA), 487(LEU), 495(GLU),
            # 499(LEU), 505(ALA), 506(GLU), 507(ASP), 509(PRO), 511(PHE)
            binding: 35,50,56,58,70,78,82,88,89,90,92,94

  - file:
      path: ../targets/mouse_marco_srcr.cif
      include:
        - chain:
            id: A
      binding_types:
        - chain:
            id: A
            # Mouse SO4 pocket: verified Q9UEW3 positions
            # 429(THR), 431(ARG), 438(TYR), 467(GLY), 473(TYR), 475(GLY),
            # 495(TRP), 506(ASN)
            binding: 12,14,21,50,56,58,78,89

  - file:
      path:
        # Hybrid interface needs maximum CDR reach for large paratope.
        # 7EOW (21aa CDR3) is RECOMMENDED for this large interface.
        - ../../example/nanobody_scaffolds/7eow.yaml
        - ../../example/nanobody_scaffolds/8coh.yaml