# Protocol: nanobody-anything
# MARCO runtime defaults (CLI, not parsed from YAML):
#   --protocol nanobody-anything
#   --diffusion_batch_size 2        # use 1-2 to preserve length diversity
#   --metrics_override plip_hbonds_refolded=0.2 delta_sasa_refolded=0.5
#   --refolding_rmsd_threshold 3.0
# Rationale: MARCO SRCR is polar/beta-rich, so prioritize buried H-bonds/SASA
# and allow VHH loop flexibility during refolding.
#
#
# ==============================================================================
# SET A: SO4 / LIGAND-BLOCKING POCKET  (human MARCO SRCR)
# ==============================================================================
#
# --- Scientific rationale ---
# The SO4²⁻ binding pocket in mouse 2OYA defines the canonical ligand-binding
# crevice of the MARCO SRCR domain. Human MARCO (Q9UEW3) is 68.6% identical to
# mouse 2OYA SRCR. The SO4 pocket residues are conserved between species.
# Nanobodies targeting this site can block receptor-ligand interactions.
#
# NOTE: These positions are DIFFERENT from the original hotspot set
# (human_marco_nanobody_hotspot.yaml). The original hotspots use Q9UEW3
# 423,425,432,461,467,469,489,500. This Set A uses Q9UEW3
# 429,431,438,467,473,475,495,506 (full-length Q9UEW3 numbering),
# which is a related but distinct set of surface residues in the same region.
#
# --- Numbering note ---
# boltzgen uses mmCIF label_seq_id. The human_MARCO_input.cif file uses
# sequential 1-520 numbering where seqid = Q9UEW3 position.
# So binding field label_seq values equal Q9UEW3 positions directly.
#
# Verified residues (from human_MARCO_input.cif, Q9UEW3 numbering):
#   Q9UEW3 429 = GLY
#   Q9UEW3 431 = TYR
#   Q9UEW3 438 = TYR
#   Q9UEW3 467 = ARG
#   Q9UEW3 473 = LEU
#   Q9UEW3 475 = GLY
#   Q9UEW3 495 = LEU
#   Q9UEW3 506 = HIS
#
# --- Diffusion parameters ---
# Recommended: NUM_STEPS=200, GUIDANCE_SCALE=0.1-0.3, TEMPERATURE=0.9-1.1
#
# --- Scaffold chain notes ---
# Each scaffold YAML already specifies its VHH chain via `include: - chain: id: B|A`.
# All scaffolds contain only a single VHH heavy chain (no light chain).
#
# --- Cys in CDRs ---
# By default nanobody-anything avoids Cys. To permit Cys in designed CDRs:
#   export EXTRA_ARGS='--inverse_fold_avoid ""' ./runs/run_nanobody_campaign.sh ...

entities:
  - file:
      path: ../targets/human_MARCO_input.cif
      include:
        - chain:
            id: A
      binding_types:
        - chain:
            id: A
            # Q9UEW3 full-length SRCR positions (verified from human_MARCO_input.cif):
            # 429(GLY), 431(TYR), 438(TYR), 467(ARG),
            # 473(LEU), 475(GLY), 495(LEU), 506(HIS)
            binding: 429,431,438,467,473,475,495,506

  - file:
      path:
        # MARCO SRCR has a deep, narrow ligand-binding crevice.
        # Best scaffolds for deep-pocket penetration:
        #   7EOW (21aa CDR3) — vWF A1 binding, maximum reach. RECOMMENDED.
        #   8COH (19aa CDR3) — high shape complementarity vs C4.
        - ../../example/nanobody_scaffolds/7eow.yaml
        - ../../example/nanobody_scaffolds/8coh.yaml